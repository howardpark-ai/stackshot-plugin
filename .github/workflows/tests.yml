# The neutral-install tests and the tree check (tests/): every hook runs under a temp HOME with no sala and a stub stackshot, and the
# tree must hold no instance strings. Standard library only. The instance patterns (the owner's names, machines, domains) are not in
# the repository: the repository SECRET CLEAN_TEXT_DENY (newline-separated regexes, as in clean-text.yml) goes to the one step that runs
# the tests; without it (a fork's pull request) only the generic patterns run and the tree test says so.
# Two merge queues can merge into main, and both need the job `tests` to report:
#  - GitHub's merge queue runs it on `merge_group`, on the branch GitHub makes for an entry (gh-readonly-queue/main/...).
#    Do not also list that branch under `push`: the entry would run twice.
#  - salamander's queue (`salamander mq`, .github/mergequeue.toml) pushes its entries to `queue/main/...` branches, which run it on `push`.
# Both read the job `tests` as the required check; a check that never reports holds the queue until it times out.
# The concurrency group is per ref. Only a pull request's older run is cancelled by a newer push; a run on main, on a queue/** branch or for a merge-queue entry
# is never cancelled, so a push to main cannot cancel main's previous run and a queue entry's required check always reports.
name: tests
on:
  pull_request:
  push:
    branches: [main, 'queue/**']
  merge_group:
    types: [checks_requested]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: scratch goes to the runner's temp folder
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"   # shared runners keep /tmp; the runner empties _temp after each job
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: unit tests
        env:
          CLEAN_TEXT_DENY: ${{ secrets.CLEAN_TEXT_DENY }}   # this step only; empty on a fork's pull request, where only the generic patterns run
        run: uv run --no-project python -m unittest discover -s tests -v
      - name: plugin manifests
        run: |
          python3 -c 'import json; [json.load(open(p)) for p in (".claude-plugin/plugin.json", ".claude-plugin/marketplace.json", "hooks/hooks.json")]'
